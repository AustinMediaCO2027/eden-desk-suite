<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eden Desk — App Preview</title>
<style>
:root{--black:#0b0b0b;--ink:#171717;--muted:#6b6b6b;--line:#e5e5e5;--bg:#f5f5f5;--white:#fff;--soft:#efefef;--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 28px}.brand svg{width:190px;height:auto}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:700}.nav button.active,.nav button:hover{background:#111;color:#fff}.plan{margin-top:auto;background:#111;color:#fff;border-radius:16px;padding:16px}.plan small{color:#bbb}.main{min-width:0}.top{height:74px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.content{padding:28px;max-width:1400px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.btn-primary{background:#111;color:#fff}.btn-light{background:#fff;border:1px solid var(--line);color:#111}.btn-soft{background:#eee;color:#111}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:12px}.hero{background:#111;color:#fff;border:0;padding:24px}.hero p{color:#cfcfcf;max-width:650px}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.hero-actions button{background:#fff;color:#111}.table-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.toolbar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.seg{display:flex;border:1px solid var(--line);border-radius:11px;padding:3px;background:#fff}.seg button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer}.seg button.active{background:#111;color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.table tr{cursor:pointer}.table tbody tr:hover{background:#fafafa}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eee;font-size:11px;font-weight:800}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:18px;z-index:30}.modal{width:min(980px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:24px}.modal-head,.modal-foot{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff}.modal-body{padding:22px}.close{border:0;background:#eee;width:38px;height:38px;border-radius:10px;font-size:22px}.doc-sheet{background:#fff;border:1px solid #ddd;border-radius:12px;padding:36px;max-width:780px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,.08)}.doc-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.doc-logo svg{width:200px}.doc-sheet table{width:100%;border-collapse:collapse;margin:24px 0}.doc-sheet th,.doc-sheet td{padding:11px;border-bottom:1px solid #ddd;text-align:left}.totals{width:310px;margin-left:auto}.total{display:flex;justify-content:space-between;padding:7px 0}.total.grand{font-size:19px;font-weight:900;border-top:2px solid #111;margin-top:6px;padding-top:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px}.field textarea{min-height:80px}.line{display:grid;grid-template-columns:2fr .6fr 1fr;gap:10px;margin:10px 0}.empty{text-align:center;padding:50px;color:var(--muted)}.mobilebar{display:none}@media(max-width:820px){.app{display:block}.sidebar{display:none}.top{padding:0 15px}.content{padding:18px 14px 92px}.cards{grid-template-columns:1fr 1fr}.row{align-items:flex-start}.toolbar{flex-direction:column;align-items:stretch}.seg{overflow:auto}.modal-bg{padding:6px;align-items:end}.modal{border-radius:22px 22px 0 0}.form-grid{grid-template-columns:1fr}.line{grid-template-columns:1fr .5fr .8fr}.doc-head{display:block}.mobilebar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px;z-index:10}.mobilebar button{border:0;background:transparent;padding:8px;font-size:11px}.mobilebar button.active{font-weight:900}}@media print{body>*{visibility:hidden}.doc-sheet,.doc-sheet *{visibility:visible}.doc-sheet{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;box-shadow:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const logo=`<svg viewBox="0 0 860 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eden desk"><path d="M34 159c31-7 55-27 73-57L156 19c-39-4-72 11-94 46L18 151c19-8 31-19 42-37l42-73c15-24 29-34 49-39l-44 78c-20 36-41 63-73 79Z" fill="#000"/><text x="185" y="131" font-family="Arial,Helvetica,sans-serif" font-size="102" font-weight="400" letter-spacing="-5">eden desk</text></svg>`;
const seed={company:{name:'Eden Desk Demo Company',email:'hello@edendesk.app',phone:'+27 31 000 0000',address:'Durban, South Africa',bank:'Bank: Demo Bank | Account: 0000000000'},customers:[{id:'c1',name:'Northstar Studio',email:'accounts@northstar.test',address:'Cape Town, South Africa'},{id:'c2',name:'Luma Retail',email:'finance@luma.test',address:'Johannesburg, South Africa'}],docs:[{id:'d1',type:'invoice',number:'INV-2026-0018',customerId:'c1',issue:'2026-07-01',due:'2026-07-15',status:'Sent',currency:'USD',items:[{description:'Digital platform implementation',qty:1,price:1280}],tax:0,discount:0,notes:'Thank you for your business.'},{id:'d2',type:'quotation',number:'QUO-2026-0007',customerId:'c2',issue:'2026-07-09',due:'2026-07-23',status:'Draft',currency:'USD',items:[{description:'Invoice app onboarding',qty:1,price:350},{description:'Premium configuration',qty:1,price:190}],tax:0,discount:0,notes:'Quotation valid for 14 days.'}]};
let data=JSON.parse(localStorage.getItem('eden_live_preview')||'null')||seed;let page='dashboard';let filter='all';let modal=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const customer=id=>data.customers.find(c=>c.id===id)||{name:'Unknown',email:'',address:''};const total=d=>{const sub=d.items.reduce((a,i)=>a+i.qty*i.price,0);const tax=sub*(d.tax||0)/100;return{sub,tax,total:sub+tax-(d.discount||0)}};const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(n);const save=()=>localStorage.setItem('eden_live_preview',JSON.stringify(data));
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand">${logo}</div><div class="nav">${nav('dashboard','Dashboard')}${nav('documents','Documents')}${nav('customers','Customers')}${nav('billing','Subscription')}</div><div class="plan"><strong>Premium preview</strong><br><small>No ads · $6.99/month</small></div></aside><main class="main"><header class="top"><div><small class="muted">${esc(data.company.name)}</small><h1>${page[0].toUpperCase()+page.slice(1)}</h1></div><button class="btn btn-primary" onclick="openCreate('invoice')">+ New document</button></header><section class="content">${content()}</section></main><nav class="mobilebar">${mnav('dashboard','Home')}${mnav('documents','Docs')}${mnav('customers','Clients')}${mnav('billing','Plan')}</nav></div>${modal?modalHtml():''}`}
function nav(p,l){return `<button class="${page===p?'active':''}" onclick="page='${p}';render()">${l}</button>`}function mnav(p,l){return `<button class="${page===p?'active':''}" onclick="page='${p}';render()">${l}</button>`}
function content(){if(page==='documents')return documents();if(page==='customers')return customers();if(page==='billing')return billing();return dashboard()}
function dashboard(){const inv=data.docs.filter(d=>d.type==='invoice');const billed=inv.reduce((s,d)=>s+total(d).total,0);return `<div class="row"><div><h2 style="margin:0">Your business workspace</h2><p class="muted">Create, preview and download invoices and quotations.</p></div></div><div class="card hero"><h2>Professional invoicing, in black and white.</h2><p>This test build includes working document creation, quote and invoice previews, local saving, document downloads and print-to-PDF.</p><div class="hero-actions"><button class="btn" onclick="openCreate('invoice')">New invoice</button><button class="btn" onclick="openCreate('quotation')">New quotation</button></div></div><div class="cards"><div class="card metric"><small>Total documents</small><strong>${data.docs.length}</strong></div><div class="card metric"><small>Invoices</small><strong>${inv.length}</strong></div><div class="card metric"><small>Quotes</small><strong>${data.docs.filter(d=>d.type==='quotation').length}</strong></div><div class="card metric"><small>Total billed</small><strong>${money(billed,'USD')}</strong></div></div><div class="row"><h3>Recent documents</h3><button class="btn btn-light" onclick="page='documents';render()">View all</button></div>${docTable(data.docs)}`}
function documents(){const docs=data.docs.filter(d=>filter==='all'||d.type===filter);return `<div class="row"><div><h2 style="margin:0">Documents</h2><p class="muted">Click any invoice or quotation to preview and download it.</p></div><button class="btn btn-primary" onclick="openCreate('invoice')">+ Create</button></div><div class="toolbar"><input id="search" placeholder="Search documents or customers" oninput="searchDocs(this.value)"><div class="seg"><button class="${filter==='all'?'active':''}" onclick="filter='all';render()">All</button><button class="${filter==='invoice'?'active':''}" onclick="filter='invoice';render()">Invoices</button><button class="${filter==='quotation'?'active':''}" onclick="filter='quotation';render()">Quotes</button></div></div><div id="doclist">${docTable(docs)}</div>`}
function docTable(docs){return `<div class="table-card"><table class="table"><thead><tr><th>Document</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>${docs.map(d=>`<tr><td onclick="openDoc('${d.id}')"><strong>${d.number}</strong><br><small class="muted">${d.type}</small></td><td onclick="openDoc('${d.id}')">${esc(customer(d.customerId).name)}</td><td onclick="openDoc('${d.id}')">${d.issue}</td><td onclick="openDoc('${d.id}')">${money(total(d).total,d.currency)}</td><td onclick="openDoc('${d.id}')"><span class="badge">${d.status}</span></td><td><button class="btn btn-soft" onclick="event.stopPropagation();openDoc('${d.id}')">Preview</button> <button class="btn btn-primary" onclick="event.stopPropagation();downloadDoc('${d.id}')">Download</button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty">No documents found.</div></td></tr>`}</tbody></table></div>`}
function searchDocs(q){q=q.toLowerCase();const docs=data.docs.filter(d=>(d.number+' '+d.type+' '+customer(d.customerId).name).toLowerCase().includes(q)&&(filter==='all'||d.type===filter));$('#doclist').innerHTML=docTable(docs)}
function customers(){return `<div class="row"><div><h2 style="margin:0">Customers</h2><p class="muted">Customer records used for invoices and quotations.</p></div></div><div class="cards">${data.customers.map(c=>`<div class="card"><strong>${esc(c.name)}</strong><p class="muted">${esc(c.email)}</p><small>${esc(c.address)}</small></div>`).join('')}</div>`}
function billing(){return `<div class="row"><div><h2 style="margin:0">Subscription</h2><p class="muted">Huawei IAP sandbox preview.</p></div></div><div class="cards" style="grid-template-columns:repeat(2,1fr)"><div class="card"><small>Standard</small><strong style="display:block;font-size:32px;margin:12px 0">$1.99<span style="font-size:14px">/month</span></strong><p>No ads · Limited documents · PDF downloads · Offline use.</p><button class="btn btn-light">Standard plan</button></div><div class="card" style="border:2px solid #111"><small>Premium</small><strong style="display:block;font-size:32px;margin:12px 0">$6.99<span style="font-size:14px">/month</span></strong><p>Unlimited documents · Recurring invoices · Statements · Reports · 5GB cloud storage.</p><button class="btn btn-primary" onclick="alert('Huawei IAP sandbox purchase simulated successfully.')">Test Huawei purchase</button></div></div>`}
function openDoc(id){modal={type:'preview',id};render()}function openCreate(type){modal={type:'create',doc:{id:'d'+Date.now(),type,number:(type==='invoice'?'INV':'QUO')+'-2026-'+String(data.docs.length+1).padStart(4,'0'),customerId:data.customers[0].id,issue:new Date().toISOString().slice(0,10),due:new Date(Date.now()+14*864e5).toISOString().slice(0,10),status:'Draft',currency:'USD',items:[{description:'',qty:1,price:0}],tax:0,discount:0,notes:''}};render()}function closeModal(){modal=null;render()}
function modalHtml(){if(modal.type==='create')return createModal(modal.doc);const d=data.docs.find(x=>x.id===modal.id);return `<div class="modal-bg"><section class="modal"><div class="modal-head"><h3>${d.number} preview</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${docHtml(d)}</div><div class="modal-foot"><button class="btn btn-light" onclick="closeModal()">Close</button><button class="btn btn-light" onclick="window.print()">Print / Save PDF</button><button class="btn btn-primary" onclick="downloadDoc('${d.id}')">Download document</button></div></section></div>`}
function createModal(d){return `<div class="modal-bg"><section class="modal"><div class="modal-head"><h3>Create ${d.type==='quotation'?'quotation':'invoice'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Document number</label><input id="num" value="${d.number}"></div><div class="field"><label>Customer</label><select id="cust">${data.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Issue date</label><input id="issue" type="date" value="${d.issue}"></div><div class="field"><label>${d.type==='quotation'?'Valid until':'Due date'}</label><input id="due" type="date" value="${d.due}"></div></div><h4>Line item</h4><div class="line"><div class="field"><label>Description</label><input id="desc" placeholder="Service or product"></div><div class="field"><label>Qty</label><input id="qty" type="number" value="1"></div><div class="field"><label>Price</label><input id="price" type="number" value="0"></div></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Notes or payment terms"></textarea></div></div><div class="modal-foot"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveCreated()">Save and preview</button></div></section></div>`}
function saveCreated(){const d=modal.doc;d.number=$('#num').value;d.customerId=$('#cust').value;d.issue=$('#issue').value;d.due=$('#due').value;d.items=[{description:$('#desc').value||'Professional services',qty:Number($('#qty').value||1),price:Number($('#price').value||0)}];d.notes=$('#notes').value;data.docs.unshift(d);save();modal={type:'preview',id:d.id};page='documents';render()}
function docHtml(d){const c=customer(d.customerId),t=total(d),label=d.type==='quotation'?'QUOTATION':'INVOICE';return `<article class="doc-sheet" id="document"><div class="doc-head"><div class="doc-logo">${logo}<p>${esc(data.company.address)}<br>${esc(data.company.email)} · ${esc(data.company.phone)}</p></div><div style="text-align:right"><small>${label}</small><h2>${d.number}</h2><p>Issued: ${d.issue}<br>${d.type==='quotation'?'Valid until':'Due'}: ${d.due}</p></div></div><hr style="border:0;border-top:2px solid #111"><p><small>BILL TO</small></p><h3>${esc(c.name)}</h3><p>${esc(c.address)}<br>${esc(c.email)}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${d.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${money(i.price,d.currency)}</td><td>${money(i.qty*i.price,d.currency)}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="total"><span>Subtotal</span><strong>${money(t.sub,d.currency)}</strong></div><div class="total"><span>Tax</span><strong>${money(t.tax,d.currency)}</strong></div><div class="total grand"><span>Total</span><span>${money(t.total,d.currency)}</span></div></div><div style="margin-top:35px"><strong>Payment details</strong><p>${esc(data.company.bank)}</p><strong>Notes</strong><p>${esc(d.notes||'Thank you for your business.')}</p></div></article>`}
function downloadDoc(id){const d=data.docs.find(x=>x.id===id);const html=`<!doctype html><meta charset="utf-8"><title>${d.number}</title><style>body{font-family:Arial;padding:40px;max-width:850px;margin:auto;color:#111}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.doc-head{display:flex;justify-content:space-between}.totals{width:300px;margin-left:auto}.total{display:flex;justify-content:space-between;padding:7px}.grand{font-size:18px;font-weight:bold;border-top:2px solid #111}svg{width:220px}</style>${docHtml(d)}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=d.number+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function render(){document.getElementById('root').innerHTML=shell()}render();
</script>
</body>
</html>
