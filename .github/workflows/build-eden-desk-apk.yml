name: Build Eden Desk Test APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile installable debug APK
        run: gradle -p android-wrapper --no-daemon clean assembleDebug --stacktrace

      - name: Prepare named APK
        run: |
          mkdir -p release-artifacts
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk release-artifacts/EdenDesk-test.apk
          sha256sum release-artifacts/EdenDesk-test.apk > release-artifacts/EdenDesk-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdenDesk-test-apk
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
